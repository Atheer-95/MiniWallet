name: miniwallet

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: 2g

volumes:
  oracle-data:
