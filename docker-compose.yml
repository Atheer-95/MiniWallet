name: miniwallet

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: 2g

  flyway:
    image: flyway/flyway:10
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      FLYWAY_USER: miniwallet
      FLYWAY_PASSWORD: ${DB_OWNER_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      oracle:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  oracle-data:
